<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La lanterne</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0b0d'/><path d='M13 8V6h6v2M11 27h10' stroke='%23d4a24c' stroke-width='2' fill='none'/><rect x='10' y='9' width='12' height='16' rx='3' fill='none' stroke='%23d4a24c' stroke-width='2'/><path d='M16 12c3 3 3 6 0 9c-3-3-3-6 0-9z' fill='%23e5383b'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=202611241600">
  <link rel="stylesheet" href="game/game.css?v=202611241600">
</head>
<body class="game">
  <header class="nav">
    <h1 id="title" class="logo"></h1>
    <div class="nav-actions">
      <button class="chip" id="export" title="Télécharger la sauvegarde">Exporter</button>
      <label class="chip" title="Charger une sauvegarde">Importer<input type="file" id="import" accept="application/json" hidden></label>
      <button class="chip" id="reset">Recommencer</button>
      <a class="chip" href="about.html">Auteur</a>
    </div>
  </header>

  <main class="layout">
    <section class="panel lantern">
      <h3>La lanterne</h3>
      <p class="help">Choisissez un moment, un lieu et toutes les personnes présentes, puis allumez la lanterne pour revivre la scène.</p>
      <h4>Moment</h4><div id="moments" class="chips"></div>
      <h4>Lieu</h4><div id="places" class="chips"></div>
      <h4>Personnes présentes</h4><div id="people" class="chips"></div>
      <button class="btn" id="light">Allumer la lanterne</button>
      <p id="msg" class="msg"></p>
    </section>

    <section class="panel reader" id="scene"></section>

    <section class="panel side">
      <nav class="tabs">
        <button class="on" data-tab="scenes">Scènes</button>
        <button data-tab="people">Personnes</button>
        <button data-tab="notes">Carnet</button>
        <button data-tab="search">Chercher</button>
        <button data-tab="puzzles" id="tab-btn-puzzles" hidden>Énigmes</button>
        <button data-tab="final" id="tab-btn-final" hidden>Dénouement</button>
      </nav>
      <div class="tab on" id="tab-scenes"></div>
      <div class="tab" id="tab-people"></div>
      <div class="tab" id="tab-notes"></div>
      <div class="tab" id="tab-search"></div>
      <div class="tab" id="tab-puzzles"></div>
      <div class="tab" id="tab-final"></div>
    </section>
  </main>

  <dialog id="intro">
    <div id="intro-text"></div>
    <form method="dialog"><button class="btn">Commencer</button></form>
  </dialog>

  <dialog id="notice">
    <div id="notice-text"></div>
    <form method="dialog"><button class="btn">Continuer</button></form>
  </dialog>

  <dialog id="minigame">
    <div class="modal-head"><h3 id="mg-title"></h3><form method="dialog"><button class="chip">✕</button></form></div>
    <div id="mg-board"></div>
    <p id="mg-status" class="mono gold"></p>
  </dialog>

  <script src="assets/i18n.js?v=202611241600"></script>
  <script>lang = "fr";</script>
  <script src="assets/puzzles.js?v=202611241600"></script>
  <script src="game/story.js?v=202611241600"></script>
  <script src="game/engine.js?v=202611241600"></script>
</body>
</html>
