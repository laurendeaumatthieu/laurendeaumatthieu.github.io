<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquête</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0b0d'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23d4a24c' stroke-width='2'/><circle cx='16' cy='16' r='3.5' fill='%23e5383b'/><path d='M16 3v4M16 25v4M3 16h4M25 16h4' stroke='%23d4a24c' stroke-width='2'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=202611271100">
  <link rel="stylesheet" href="game/game.css?v=202611271100">
</head>
<body class="game">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="crt" aria-hidden="true"></div>
  <header class="bar">
    <div class="brand"><span class="led"></span><h1 id="title"></h1></div>
    <nav id="sections" class="sections"></nav>
    <div id="stats" class="stats mono"></div>
    <div class="ticker mono"><div id="ticker-text"></div></div>
    <div id="telemetry" class="telemetry mono" aria-hidden="true"></div>
    <div class="menu">
      <button id="menu-btn" class="burger" title="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
      <div id="menu" class="tools" hidden>
        <button id="sound" title="Effets sonores"></button>
        <button id="ambient" title="Fond sonore"></button>
        <button id="export" title="Télécharger la sauvegarde">exporter la sauvegarde</button>
        <label title="Charger une sauvegarde">importer une sauvegarde<input type="file" id="import" accept="application/json" hidden></label>
        <button id="reset" title="Effacer la progression">recommencer</button>
        <a href="about.html">page de l'auteur</a>
      </div>
    </div>
  </header>

  <main class="layout">
    <section id="pane" class="pane"></section>
    <article id="reader" class="reader"></article>
  </main>

  <div id="toasts"></div>

  <dialog id="boot">
    <div id="boot-log" class="mono"></div>
    <h2 id="boot-title"></h2>
    <p id="boot-tag" class="mono">Prise de poste · police de la colonie</p>
    <form method="dialog"><button class="btn" id="boot-go">▸ Commencer l'enquête</button></form>
  </dialog>

  <dialog id="notice">
    <div id="notice-text"></div>
    <form method="dialog"><button class="btn">Continuer</button></form>
  </dialog>

  <dialog id="minigame">
    <div class="modal-head"><h3 id="mg-title"></h3><form method="dialog"><button class="chip">✕</button></form></div>
    <div id="mg-board"></div>
    <p id="mg-status" class="mono gold"></p>
  </dialog>

  <script src="assets/i18n.js?v=202611271100"></script>
  <script>lang = "fr";</script>
  <script src="assets/puzzles.js?v=202611271100"></script>
  <script src="game/story.js?v=202611271100"></script>
  <script src="game/fx.js?v=202611271100"></script>
  <script src="game/rover.js?v=202611271100"></script>
  <script src="game/engine.js?v=202611271100"></script>
</body>
</html>
