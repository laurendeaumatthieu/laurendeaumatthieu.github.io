<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthieu Laurendeau</title>
  <meta name="description" content="Original browser puzzles by Matthieu Laurendeau.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0b0d'/><text x='16' y='22' font-family='monospace' font-size='14' font-weight='700' text-anchor='middle'><tspan fill='%23e5383b'>M</tspan><tspan fill='%23d4a24c'>L</tspan></text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=202611241600">
</head>
<body>
  <header class="nav">
    <a class="logo" href="./"><span class="red">M</span><span class="gold">L</span></a>
    <div class="nav-actions">
      <button id="lang" class="chip" aria-label="Switch language">FR</button>
      <a class="btn" href="./" data-i18n="nav.game">Back to the game</a>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <canvas id="waves" aria-hidden="true"></canvas>
      <div class="hero-text">
        <p class="mono gold" data-i18n="hero.hello">Hi, I'm</p>
        <h1>Matthieu <span class="red">Laurendeau</span></h1>
        <a class="scroll mono" href="#puzzles" data-i18n="hero.scroll">Puzzles ↓</a>
      </div>
    </section>

    <section id="puzzles" class="section">
      <h2 data-i18n="puzzles.title">Puzzles</h2>
      <p data-i18n="puzzles.intro"></p>
      <div class="grid" id="puzzle-grid"></div>
    </section>


  </main>

  <footer class="mono muted">© <span id="year"></span> Matthieu Laurendeau · <span data-i18n="footer"></span></footer>

  <dialog id="modal">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="chip" id="modal-close" aria-label="Close">✕</button>
    </div>
    <p id="modal-rules" class="muted"></p>
    <div id="game"></div>
    <div class="modal-foot">
      <span id="status" class="mono gold"></span>
      <button class="btn ghost" id="new-game" data-i18n="game.new">New game</button>
    </div>
  </dialog>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="assets/i18n.js?v=202611241600"></script>
  <script src="assets/puzzles.js?v=202611241600"></script>
  <script src="assets/main.js?v=202611241600"></script>
</body>
</html>
